[workspace]
members = [
    "crates/systrace-core",
    "crates/systrace-gui",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rustc-hash = "2"
lasso = { version = "0.7", features = ["multi-threaded"] }
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
