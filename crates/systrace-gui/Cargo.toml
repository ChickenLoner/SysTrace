[package]
name = "systrace-gui"
version = "1.2.0"
edition = "2021"
authors = ["Warawut Manosong (Chicken0248)"]
description = "SysTrace — Sysmon forensic analysis tool for DFIR investigators"
homepage = "https://github.com/ChickenLoner/SysTrace"
repository = "https://github.com/ChickenLoner/SysTrace"
license = "MIT"

[[bin]]
name = "systrace-gui"
path = "src/main.rs"

[dependencies]
systrace-core = { path = "../systrace-core" }
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
crossbeam-channel = { workspace = true }
chrono = { workspace = true }
lasso = { workspace = true }
image = { version = "0.25", features = ["png"] }

# Build-time dependencies (Windows icon embedding only)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
ico          = "0.3"
image        = { version = "0.25", features = ["png"] }
